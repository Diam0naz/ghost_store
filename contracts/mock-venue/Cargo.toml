[package]
name = "mock-venue"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5.11.0", features = ["legacy"] }

# Test-only: near-sdk refuses to compile outside `cargo near build` unless one of its
# non-contract cfgs (here `unit-testing`) is enabled by a dev-dependency.
[dev-dependencies]
anyhow = "1"
near-sdk = { version = "5.11.0", features = ["unit-testing"] }
near-workspaces = "0.24"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# The end-to-end cycle tests drive the real treasury code next to the real venue code.
treasury = { path = "../treasury" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
