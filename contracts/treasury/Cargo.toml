[package]
name = "treasury"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `unstable` exposes env::ecrecover, used to verify NEAR AI Cloud TEE response signatures.
near-sdk = { version = "5", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "5", features = ["unstable", "unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
